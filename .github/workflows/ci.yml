name: core-simulation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Core unit and integration tests
        run: make test
      - name: Core verification campaign
        run: make verify-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-verification
          path: results/ci/
