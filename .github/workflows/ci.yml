name: verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[hardware]'
      - name: Unit and integration tests
        run: make test
      - name: CI verification campaign
        run: make verify-ci
      - name: Build dashboard
        run: make visualize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            results/ci/
            results/full/dashboard.html

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install -e '.[firmware]'
      - name: Build Heltec V2/V3 test and bridge firmware
        run: make firmware
