[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-sims"
version = "0.2.0"
description = "Comprehensive simulation and verification suite for a multi-hop LoRa UAV collision-avoidance system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sitl = ["pymavlink"]
hardware = ["pymavlink", "pyserial"]
firmware = ["platformio==6.2.0"]

[project.scripts]
drone-sims = "drone_sims.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
