[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-sims"
version = "0.3.0"
description = "Core simulation foundation for a team-built LoRa UAV awareness mesh"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
drone-sims = "drone_sims.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
